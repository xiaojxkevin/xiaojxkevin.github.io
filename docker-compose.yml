services:
  jekyll:
    build:
      context: .
    ports:
      - "4000:4000"
      - "35729:35729" # LiveReload
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
    command: bash -c "ruby scripts/sync_readings.rb && exec bundle exec jekyll serve --host 0.0.0.0 --watch --livereload --force_polling"
