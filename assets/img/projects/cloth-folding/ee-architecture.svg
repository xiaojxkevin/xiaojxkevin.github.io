<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1570" viewBox="0 0 1400 1570" role="img" aria-labelledby="title desc">
<title id="title">EE auxiliary learning: training and inference</title>
<desc id="desc">Four masked token groups share an action expert during training. Joint actions use all camera views; each auxiliary EE group directly attends to its assigned view. Inference caches the observation prefix and denoises only joint actions.</desc>
